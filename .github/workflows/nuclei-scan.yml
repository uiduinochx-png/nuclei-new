name: "OMNI-PRO-MAX"

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */1 * * *'

jobs:
  scan:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Cài nuclei
      run: |
        sudo apt-get update
        sudo apt-get install -y jq curl
        curl -s https://raw.githubusercontent.com/projectdiscovery/nuclei/main/install.sh | bash
        sudo mv nuclei /usr/local/bin/

    - name: Tạo 1000 target
      run: |
        python3 << 'EOF'
        import requests
        import json
        
        # Lấy target từ crt.sh
        targets = []
        try:
            resp = requests.get("https://crt.sh/?q=%.com&output=json", timeout=10)
            if resp.status_code == 200:
                data = resp.json()
                for item in data[:500]:
                    if 'name_value' in item:
                        targets.append(item['name_value'])
        except:
            pass
        
        # Thêm target mặc định
        default_targets = [
            "example.com", "google.com", "github.com", "facebook.com",
            "twitter.com", "linkedin.com", "youtube.com", "instagram.com"
        ]
        targets.extend(default_targets)
        
        # Lưu target
        with open("targets.txt", "w") as f:
            for t in set(targets):
                f.write(f"https://{t}\n")
        
        print(f"✅ Đã tạo {len(set(targets))} target")
        EOF

    - name: Quét nuclei - Tìm lỗi có tiền
      run: |
        nuclei -list targets.txt \
               -severity critical,high,medium \
               -c 50 \
               -rate-limit 100 \
               -silent \
               -json \
               -o ketqua.json || true

    - name: Phân tích và báo cáo
      run: |
        python3 << 'EOF'
        import json
        import sys
        
        vulns = []
        try:
            with open('ketqua.json', 'r') as f:
                for line in f:
                    try:
                        data = json.loads(line.strip())
                        if 'info' in data:
                            vulns.append({
                                'host': data.get('host', 'N/A'),
                                'name': data['info'].get('name', 'N/A'),
                                'severity': data['info'].get('severity', 'N/A'),
                                'cve': data['info'].get('cve', 'N/A')
                            })
                    except:
                        pass
        except:
            pass
        
        # Thống kê
        critical = sum(1 for v in vulns if v['severity'] == 'critical')
        high = sum(1 for v in vulns if v['severity'] == 'high')
        medium = sum(1 for v in vulns if v['severity'] == 'medium')
        
        # In báo cáo
        print("=" * 70)
        print("  🚀 OMNI-PRO-MAX - BÁO CÁO LỖ HỔNG CÓ TIỀN")
        print("=" * 70)
        print(f"  📅 Thời gian: $(date)")
        print(f"  📊 Tổng lỗi: {len(vulns)}")
        print(f"  🔴 Critical: {critical} - $5,000+")
        print(f"  🟠 High: {high} - $1,000-$5,000")
        print(f"  🟡 Medium: {medium} - $500-$1,000")
        print("=" * 70)
        
        if vulns:
            print("\n📋 DANH SÁCH LỖI (CÓ TIỀN):")
            for v in vulns[:20]:
                severity = v['severity'].upper()
                print(f"  [{severity}] {v['host']}")
                print(f"    → {v['name']}")
                if v['cve'] != 'N/A':
                    print(f"    → CVE: {v['cve']}")
                print()
        
        # Lưu báo cáo
        with open('report.json', 'w') as f:
            json.dump({
                'total': len(vulns),
                'critical': critical,
                'high': high,
                'medium': medium,
                'list': vulns
            }, f, indent=2)
        
        print("✅ ĐÃ LƯU BÁO CÁO")
        EOF

    - name: Upload báo cáo
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Bao-cao-lo-hong
        path: |
          report.json
          ketqua.json
          targets.txt
        retention-days: 30
