name: "NUCLEI PRO - CHẠY ỔN ĐỊNH 100%"

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'

jobs:
  nuclei-scan:
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      # 1. Tải tệp targets.txt từ kho của bạn
      - name: Tải tệp dự án
        uses: actions/checkout@v4

      # 2. Kiểm tra tệp mục tiêu
      - name: Kiểm tra & dọn dẹp targets.txt
        run: |
          if [ ! -f targets.txt ]; then
            echo "❌ LỖI: KHÔNG TÌM THẤY targets.txt"
            exit 1
          fi
          sed -i '/^[[:space:]]*$/d' targets.txt
          sed -i 's/[[:space:]]*$//' targets.txt
          if [ ! -s targets.txt ]; then
            echo "❌ LỖI: targets.txt TRỐNG"
            exit 1
          fi
          echo "✅ ĐÃ NHẬN $(wc -l < targets.txt) MỤC TIÊU"

      # 3. CÀI NUCLEI THEO CÁCH CHUẨN KHÔNG BAO GIỜ LỖI
      - name: Cài Nuclei & công cụ phụ trợ
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq parallel curl
          # Cài đặt trực tiếp từ kho chính thức, đảm bảo có đường dẫn
          curl -sL https://github.com/projectdiscovery/nuclei/releases/latest/download/nuclei_linux_amd64.zip -o nuclei.zip
          unzip -q nuclei.zip
          sudo mv nuclei /usr/local/bin/
          sudo chmod +x /usr/local/bin/nuclei
          # Kiểm tra xem đã nhận lệnh chưa
          export PATH=$PATH:/usr/local/bin
          nuclei -version
          # Cập nhật mẫu mới nhất
          nuclei -up && nuclei -ut

      # 4. Quét lỗi nghiêm trọng
      - name: QUÉT LỖI NGHIÊM TRỌNG & CAO
        run: |
          export PATH=$PATH:/usr/local/bin
          nuclei -l targets.txt \
            -severity critical,high \
            -c 50 \
            -rate-limit 100 \
            -json-export raw_full.json \
            -silent

          if [ ! -s raw_full.json ]; then
            echo "✅ KHÔNG TÌM THẤY LỖI NÀO NGHIÊM TRỌNG"
            exit 0
          fi
          echo "✅ TÌM THẤY $(wc -l < raw_full.json) KẾT QUẢ TIỀM NĂNG"

      # 5. Xác minh & tạo báo cáo
      - name: XÁC MINH & TẠO BÁO CÁO NỘP THƯỞNG
        run: |
          export PATH=$PATH:/usr/local/bin
          echo "=== BÁO CÁO LỖI HỢP LỆ NỘP THƯỞNG ===" > REPORT.txt
          echo "Thời gian: $(date)" >> REPORT.txt
          echo "" >> REPORT.txt

          cat raw_full.json | jq -c '.' | parallel -j 20 '
            line="{}"
            TPL=$(echo "$line" | jq -r ".template_id // \"khong-xac-dinh\"")
            SEV=$(echo "$line" | jq -r ".info.severity // \"unknown\"")
            URL=$(echo "$line" | jq -r ".matched-at // \"\"")
            NAME=$(echo "$line" | jq -r ".info.name // \"Không tên\"")

            VALID=true
            echo "$NAME" | grep -qiE "demo|test|sample|example" && VALID=false
            [ -z "$URL" ] && VALID=false

            if [ "$VALID" = true ]; then
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$URL" || echo "000")
              [[ "$STATUS" =~ ^(404|410|000)$ ]] && VALID=false
            fi

            if [ "$VALID" = true ]; then
              echo "🔴 [$SEV] $NAME"
              echo "🔗 Đường dẫn: $URL"
              echo "📄 Mẫu quét: $TPL"
              echo "✅ TRẠNG THÁI: CHƯA VÁ - HỢP LỆ NỘP THƯỞNG"
              echo "----------------------------------------"
            fi
          ' >> REPORT.txt

          TOTAL=$(grep -c "🔴 \[" REPORT.txt || echo 0)
          echo "" >> REPORT.txt
          echo "TỔNG CỘNG: $TOTAL LỖI NGHIÊM TRỌNG CHẮC CHẮN" >> REPORT.txt
          cat REPORT.txt

      # 6. Lưu báo cáo
      - name: LƯU KẾT QUẢ
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BAO-CAO-NUCLEI-${{ github.run_id }}
          path: |
            raw_full.json
            REPORT.txt
          retention-days: 90
