name: "OMNI-AI-FINAL"

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */2 * * *'

jobs:
  scan:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Cài đặt công cụ
      run: |
        sudo apt-get update
        sudo apt-get install -y jq curl python3 python3-pip
        pip3 install requests
        curl -s https://raw.githubusercontent.com/projectdiscovery/nuclei/main/install.sh | bash
        sudo mv nuclei /usr/local/bin/

    - name: Tạo target
      run: |
        cat > targets.txt << 'EOF'
        https://example.com
        https://google.com
        https://github.com
        https://facebook.com
        https://twitter.com
        https://linkedin.com
        https://youtube.com
        https://instagram.com
        https://tiktok.com
        https://reddit.com
        EOF

    - name: Quét Nuclei
      run: |
        nuclei -list targets.txt -severity critical,high,medium -c 30 -silent -json -o ketqua.json || true

    - name: Phân tích kết quả
      run: |
        python3 << 'PYTHON'
        import json
        import sys
        
        vulnerabilities = []
        try:
            with open('ketqua.json', 'r') as f:
                for line in f:
                    try:
                        data = json.loads(line.strip())
                        if 'info' in data:
                            vuln = {
                                'host': data.get('host', 'unknown'),
                                'name': data['info'].get('name', 'unknown'),
                                'severity': data['info'].get('severity', 'unknown'),
                                'cve': data['info'].get('cve', 'N/A')
                            }
                            vulnerabilities.append(vuln)
                    except:
                        pass
        except:
            pass
        
        # Đếm theo severity
        critical = sum(1 for v in vulnerabilities if v['severity'] == 'critical')
        high = sum(1 for v in vulnerabilities if v['severity'] == 'high')
        medium = sum(1 for v in vulnerabilities if v['severity'] == 'medium')
        
        # In báo cáo
        print("=" * 60)
        print("  🚀 OMNI-AI - BÁO CÁO LỖ HỔNG")
        print("=" * 60)
        print(f"  Thời gian: $(date)")
        print(f"  Tổng lỗi: {len(vulnerabilities)}")
        print(f"  - Critical: {critical}")
        print(f"  - High: {high}")
        print(f"  - Medium: {medium}")
        print("=" * 60)
        
        if vulnerabilities:
            print("\n📋 DANH SÁCH LỖI:")
            for v in vulnerabilities[:10]:
                print(f"  [{v['severity'].upper()}] {v['host']}")
                print(f"    → {v['name']}")
                if v['cve'] != 'N/A':
                    print(f"    → CVE: {v['cve']}")
                print()
        
        # Lưu report
        with open('report.json', 'w') as f:
            json.dump({
                'total': len(vulnerabilities),
                'critical': critical,
                'high': high,
                'medium': medium,
                'list': vulnerabilities
            }, f, indent=2)
        
        PYTHON

    - name: Hiển thị báo cáo
      run: |
        echo "========================================"
        echo "  ✅ QUÉT HOÀN TẤT"
        echo "========================================"
        cat report.json 2>/dev/null || echo "Chưa có dữ liệu"

    - name: Upload
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Bao-cao
        path: |
          ketqua.json
          report.json
          targets.txt
        retention-days: 7
