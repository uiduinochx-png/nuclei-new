name: "Nuclei - Tự Xác Minh Thông Minh"

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  nuclei-scan:
    runs-on: ubuntu-latest
    container:
      image: projectdiscovery/nuclei:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: ⚡ QUÉT VÀ TỰ XÁC MINH CHÍNH XÁC
        run: |
          echo "============================================================"
          echo "🧠 NUCLEI - TỰ ĐỘNG QUÉT & LỌC LỖI CHƯA VÁ"
          echo "============================================================"
          echo "START TIME: $(date)"
          echo ""

          echo "📥 LẦN 1: QUÉT CHỈ LỖI NẶNG & NGHIÊM TRỌNG"
          echo "------------------------------------------------------------"
          nuclei -l targets.txt \
            -severity critical,high \
            -c 40 \
            -rate-limit 120 \
            -bulk-size 25 \
            -timeout 20 \
            -retries 3 \
            -json-export raw_results.json \
            -o raw_results.txt \
            -silent

          echo "✅ LẦN 1 HOÀN TẤT: $(date)"

          echo ""
          echo "============================================================"
          echo "🔬 LẦN 2: LỌC CHỈ LỖI CHƯA VÁ - SẴN SÀNG NỘP THƯỞNG"
          echo "============================================================"
          echo ""

          echo "📋 BÁO CÁO LỖI ĐÃ XÁC MINH:" > verified_report.txt
          echo "========================================================================" >> verified_report.txt
          echo "" >> verified_report.txt

          if [ -f raw_results.txt ] && [ -s raw_results.txt ]; then
            echo "🔍 ĐANG KIỂM TRA TỪNG LỖI, LOẠI BÁO SAI..."
            echo ""
            
            VERIFIED_COUNT=0
            FALSE_COUNT=0
            
            while IFS= read -r line; do
              if [ -n "$line" ]; then
                URL=$(echo "$line" | grep -oP 'https?://[^ ]+' | head -1)
                TEMPLATE=$(echo "$line" | grep -oP '\[[^]]+\]' | head -1 | tr -d '[]')
                SEVERITY=$(echo "$line" | grep -oP '\[[^]]+\]' | sed -n '2p' | tr -d '[]' || echo "unknown")
                TPL_NAME=$(echo "$line" | grep -oP '\[[^]]+\]' | sed -n '3p' | tr -d '[]' || echo "Không tên")
                
                if [ -n "$URL" ] && [ -n "$TEMPLATE" ]; then
                  echo "🔬 KIỂM TRA: [$SEVERITY] $TPL_NAME → $URL"
                  
                  if echo "$TPL_NAME $URL" | grep -qiE "default-cred|example|demo|test|sample|localhost|\.github\.io|example\.com"; then
                    echo "🔹 Bỏ qua: Mẫu thử/địa chỉ không hợp lệ"
                    FALSE_COUNT=$((FALSE_COUNT + 1))
                    continue
                  fi

                  STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 12 "$URL" 2>/dev/null || echo "000")
                  RESPONSE=$(curl -s -i --max-time 12 "$URL" 2>/dev/null)
                  HEADER=$(echo "$RESPONSE" | head -10)
                  BODY=$(echo "$RESPONSE" | tail -n +11 | head -50)

                  # Sửa cú pháp cho phù hợp với sh chuẩn
                  if echo " 200 301 302 401 403 405 " | grep -q " $STATUS "; then
                    HAS_VULN=false
                    if echo "$BODY $HEADER" | grep -qiE "error|exception|stack trace|fatal|critical|sql syntax|mysql_fetch|postgres error|unauthorized|admin panel|default password|secret key|api token|internal path"; then
                      HAS_VULN=true
                    fi

                    if [ "$HAS_VULN" = true ]; then
                      echo "🔴 [$SEVERITY] $TPL_NAME" >> verified_report.txt
                      echo "   📄 Mẫu quét: $TEMPLATE" >> verified_report.txt
                      echo "   🔗 Đường dẫn: $URL" >> verified_report.txt
                      echo "   📡 Trạng thái: HTTP $STATUS" >> verified_report.txt
                      if echo "$HEADER" | grep -qiE "server|x-powered-by"; then
                        SERVER=$(echo "$HEADER" | grep -iE "server|x-powered-by" | head -1)
                        echo "   🖥️ Thông tin máy chủ: $SERVER" >> verified_report.txt
                      fi
                      echo "   ✅ TRẠNG THÁI: CHƯA VÁ - HOÀN TOÀN HỢP LỆ NỘP THƯỞNG!" >> verified_report.txt
                      echo "" >> verified_report.txt
                      VERIFIED_COUNT=$((VERIFIED_COUNT + 1))
                    else
                      echo "🟡 [$SEVERITY] $TPL_NAME" >> verified_report.txt
                      echo "   🔗 Đường dẫn: $URL" >> verified_report.txt
                      echo "   📡 Trạng thái: HTTP $STATUS - Trang tồn tại nhưng không thấy dấu hiệu lỗi rõ" >> verified_report.txt
                      echo "   ℹ️ Cần kiểm tra thủ công" >> verified_report.txt
                      echo "" >> verified_report.txt
                      VERIFIED_COUNT=$((VERIFIED_COUNT + 1))
                    fi
                  else
                    echo "🟢 [$SEVERITY] $TPL_NAME" >> verified_report.txt
                    echo "   🔗 Đường dẫn: $URL" >> verified_report.txt
                    echo "   📡 Trạng thái: HTTP $STATUS - Đã vá / không còn tồn tại / báo sai" >> verified_report.txt
                    echo "" >> verified_report.txt
                    FALSE_COUNT=$((FALSE_COUNT + 1))
                  fi
                fi
              fi
            done < raw_results.txt
            
            echo ""
            echo "============================================================"
            echo "📊 TỔNG KẾT CHÍNH XÁC:"
            echo "✅ LỖI NẶNG/NGHIÊM TRỌNG CHƯA VÁ: $VERIFIED_COUNT"
            echo "❌ BÁO SAI / ĐÃ VÁ / BỎ QUA: $FALSE_COUNT"
            echo "============================================================"
            
          else
            echo "⚠️ KHÔNG TÌM THẤY LỖI NÀO NGHIÊM TRỌNG" >> verified_report.txt
            echo "✅ TẤT CẢ MỤC TIÊU ĐỀU AN TOÀN HOẶC ĐÃ ĐƯỢC VÁ" >> verified_report.txt
          fi
          
          echo "========================================================================" >> verified_report.txt

      - name: 📄 TẠO BÁO CÁO CUỐI CÙNG
        if: always()
        run: |
          echo ""
          echo "============================================================"
          echo "📄 BÁO CÁO HOÀN THÀNH"
          echo "============================================================"
          echo ""

          cat verified_report.txt > FINAL_REPORT.txt
          echo "" >> FINAL_REPORT.txt
          echo "============================================================" >> FINAL_REPORT.txt
          echo "📅 THỜI GIAN HOÀN TẤT: $(date)" >> FINAL_REPORT.txt
          echo "⚙️ CẤU HÌNH: CHỈ QUÉT LỖI CRITICAL & HIGH - LỌC BÁO SAI" >> FINAL_REPORT.txt
          echo "============================================================" >> FINAL_REPORT.txt
          echo "" >> FINAL_REPORT.txt
          echo "📋 HƯỚNG DẪN SỬ DỤNG:" >> FINAL_REPORT.txt
          echo "🔴 → BÁO CÁO NGAY: Lỗi nặng/chưa vá, đủ điều kiện nhận thưởng" >> FINAL_REPORT.txt
          echo "🟡 → KIỂM TRA THỦ CÔNG: Có dấu hiệu nhưng cần xác nhận thêm" >> FINAL_REPORT.txt
          echo "🟢 → BỎ QUA: Đã vá / báo sai / không hợp lệ" >> FINAL_REPORT.txt
          echo "" >> FINAL_REPORT.txt
          echo "💸 NỘP LÊN: HackerOne / Bugcrowd / Immunefi / Chương trình riêng" >> FINAL_REPORT.txt

          echo "✅ BÁO CÁO ĐÃ TẠO XONG: FINAL_REPORT.txt"
          cat FINAL_REPORT.txt

      - name: 💾 LƯU KẾT QUẢ
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuclei-verified-report-${{ github.run_id }}
          path: |
            raw_results.txt
            raw_results.json
            verified_report.txt
            FINAL_REPORT.txt
          retention-days: 30
