name: Nuclei OMNI - Siêu Quét Tự Động

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  omni-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cài Nuclei
        run: |
          wget https://github.com/projectdiscovery/nuclei/releases/latest/download/nuclei_linux_amd64.zip
          unzip nuclei_linux_amd64.zip
          sudo mv nuclei /usr/local/bin/
          nuclei -version

      - name: Cập nhật template
        run: |
          nuclei -update-templates

      - name: Quét siêu sâu
        run: |
          nuclei -list targets.txt \
            -tags cve,kev,exposure,panel,default-login,unauth,rce,sqli,lfi,fileupload,ssrf \
            -severity critical,high,medium \
            -o results_raw.txt \
            -json \
            -stats \
            -silent \
            -timeout 30 \
            -rate-limit 10 \
            -concurrency 30 \
            -retries 2 \
            || true

      - name: Lọc lỗ hổng critical + high
        run: |
          grep -E '"severity":"(critical|high)"' results_raw.txt > results_high_value.json || echo "[]" > results_high_value.json

      - name: Upload kết quả
        uses: actions/upload-artifact@v4
        with:
          name: nuclei-omni-results
          path: |
            results_raw.txt
            results_high_value.json
