name: "NUCLEI PRO - CHẠY ĐÚNG KHÔNG LỖI NỮA"

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'

jobs:
  nuclei-scan:
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - name: 📥 Tải tệp dự án
        uses: actions/checkout@v4

      - name: ✅ Kiểm tra & dọn dẹp targets.txt
        run: |
          if [ ! -f targets.txt ]; then
            echo "❌ LỖI: KHÔNG TÌM THẤY targets.txt"
            exit 1
          fi
          sed -i '/^[[:space:]]*$/d' targets.txt
          sed -i 's/[[:space:]]*$//' targets.txt
          if [ ! -s targets.txt ]; then
            echo "❌ LỖI: targets.txt TRỐNG"
            exit 1
          fi
          echo "✅ ĐÃ NHẬN $(wc -l < targets.txt) MỤC TIÊU"

      - name: ⚙️ Cài Nuclei - CÁCH AN TOÀN NHẤT KHÔNG LỖI LINK
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq parallel curl
          # Cài qua kho gói chính thức của Nuclei trên GitHub - không cần tải zip thủ công
          curl -fsSL https://apt.projectdiscovery.io/install.sh | sudo bash
          sudo apt-get install -y nuclei
          # Kiểm tra chắc chắn
          nuclei -version
          # Cập nhật mẫu
          nuclei -up && nuclei -ut

      - name: 🚀 QUÉT LỖI NGHIÊM TRỌNG & CAO
        run: |
          nuclei -l targets.txt \
            -severity critical,high \
            -c 50 \
            -rate-limit 100 \
            -json-export raw_full.json \
            -silent

          if [ ! -s raw_full.json ]; then
            echo "✅ KHÔNG TÌM THẤY LỖI NÀO NGHIÊM TRỌNG"
            exit 0
          fi
          echo "✅ TÌM THẤY $(wc -l < raw_full.json) KẾT QUẢ TIỀM NĂNG"

      - name: 🧠 XÁC MINH & TẠO BÁO CÁO
        run: |
          echo "=== BÁO CÁO LỖI HỢP LỆ NỘP THƯỞNG ===" > REPORT.txt
          echo "Thời gian: $(date)" >> REPORT.txt
          echo "" >> REPORT.txt

          cat raw_full.json | jq -c '.' | parallel -j 20 '
            line="{}"
            TPL=$(echo "$line" | jq -r ".template_id // \"khong-xac-dinh\"")
            SEV=$(echo "$line" | jq -r ".info.severity // \"unknown\"")
            URL=$(echo "$line" | jq -r ".matched-at // \"\"")
            NAME=$(echo "$line" | jq -r ".info.name // \"Không tên\"")

            VALID=true
            echo "$NAME" | grep -qiE "demo|test|sample|example" && VALID=false
            [ -z "$URL" ] && VALID=false

            if [ "$VALID" = true ]; then
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$URL" || echo "000")
              [[ "$STATUS" =~ ^(404|410|000)$ ]] && VALID=false
            fi

            if [ "$VALID" = true ]; then
              echo "🔴 [$SEV] $NAME"
              echo "🔗 $URL"
              echo "📄 Mẫu quét: $TPL"
              echo "✅ CHƯA VÁ - HỢP LỆ NỘP THƯỞNG"
              echo "----------------------------------------"
            fi
          ' >> REPORT.txt

          TOTAL=$(grep -c "🔴 \[" REPORT.txt || echo 0)
          echo "" >> REPORT.txt
          echo "TỔNG CỘNG: $TOTAL LỖI NGHIÊM TRỌNG CHẮC CHẮN" >> REPORT.txt
          cat REPORT.txt

      - name: 💾 LƯU KẾT QUẢ
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BAO-CAO-NUCLEI-${{ github.run_id }}
          path: |
            raw_full.json
            REPORT.txt
          retention-days: 90
