name: "OMNI-FINAL"

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */2 * * *'

jobs:
  scan:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Python Scan
      run: |
        python3 << 'PYTHON'
        import requests
        import json
        import time
        from urllib.parse import urlparse

        print("=" * 60)
        print("🚀 OMNI-AI - BẮT ĐẦU QUÉT")
        print("=" * 60)

        targets = [
            "https://example.com",
            "https://google.com", 
            "https://github.com",
            "https://facebook.com",
            "https://twitter.com",
            "https://linkedin.com",
            "https://youtube.com",
            "https://instagram.com",
            "https://tiktok.com",
            "https://reddit.com"
        ]

        results = []
        total_money = 0

        for target in targets:
            try:
                print(f"\n[+] Đang quét: {target}")
                resp = requests.get(target, timeout=5, headers={"User-Agent": "Mozilla/5.0"})
                
                if resp.status_code == 200:
                    content = resp.text.lower()
                    
                    # Tìm lỗ hổng
                    vulns = []
                    
                    if "sql" in content or "select" in content or "union" in content:
                        vulns.append({"type": "SQL Injection", "money": "$5,000"})
                    
                    if "script" in content or "alert" in content or "onerror" in content:
                        vulns.append({"type": "XSS", "money": "$3,000"})
                    
                    if "admin" in content or "password" in content or "login" in content:
                        vulns.append({"type": "Admin Panel", "money": "$2,000"})
                    
                    if "api" in content and "key" in content:
                        vulns.append({"type": "API Key Exposed", "money": "$8,000"})
                    
                    if "config" in content or "backup" in content:
                        vulns.append({"type": "Config Exposure", "money": "$1,000"})
                    
                    if vulns:
                        for v in vulns:
                            results.append({
                                "target": target,
                                "type": v["type"],
                                "money": v["money"]
                            })
                            money = int(v["money"].replace("$", "").replace(",", ""))
                            total_money += money
                        print(f"   ✅ Phát hiện: {len(vulns)} lỗi")
                    else:
                        print("   ⚪ Chưa phát hiện lỗi")
                else:
                    print(f"   ⚠️ Status: {resp.status_code}")
                    
            except Exception as e:
                print(f"   ❌ Lỗi: {str(e)[:50]}")

        print("\n" + "=" * 60)
        print("📊 BÁO CÁO TỔNG KẾT")
        print("=" * 60)
        print(f"Tổng số lỗi phát hiện: {len(results)}")
        print(f"Tổng tiền tiềm năng: ${total_money:,}")
        print("=" * 60)

        if results:
            print("\n📋 CHI TIẾT LỖI:")
            for r in results:
                print(f"  • {r['target']}")
                print(f"    → {r['type']} - {r['money']}")

        with open("report.json", "w") as f:
            json.dump({
                "total_vulns": len(results),
                "total_money": total_money,
                "results": results
            }, f, indent=2)

        print("\n✅ ĐÃ LƯU BÁO CÁO")
        PYTHON

    - name: Upload
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Bao-cao
        path: report.json
        retention-days: 7
