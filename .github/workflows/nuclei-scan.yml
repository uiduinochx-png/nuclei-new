name: "🔥 SIÊU QUÉT - FULL SPECTRUM BOUNTY"

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */3 * * *'

jobs:
  deep_scan:
    timeout-minutes: 360
    runs-on: ubuntu-latest
    steps:
      - name: 🔧 CÀI ĐẶT SIÊU CÔNG CỤ
        run: |
          echo "============================================================"
          echo "🔥 CÀI ĐẶT SIÊU CÔNG CỤ - FULL SPECTRUM"
          echo "============================================================"
          
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl wget jq python3 python3-pip git unzip \
            nmap masscan chromium-browser firefox-geckodriver \
            python3-venv python3-dev libssl-dev libffi-dev \
            nikto whatweb wpscan sqlmap 2>&1 | tee -a install.log
          
          cd /tmp
          wget -q https://go.dev/dl/go1.22.5.linux-amd64.tar.gz
          sudo tar -xf go1.22.5.linux-amd64.tar.gz -C /usr/local
          export PATH=$PATH:/usr/local/go/bin
          export PATH=$PATH:~/go/bin
          
          # ===== 30+ CÔNG CỤ =====
          go install -v github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest
          go install -v github.com/projectdiscovery/httpx/cmd/httpx@latest
          go install -v github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
          go install -v github.com/projectdiscovery/naabu/v2/cmd/naabu@latest
          go install -v github.com/projectdiscovery/katana/cmd/katana@latest
          go install -v github.com/projectdiscovery/shuffledns/cmd/shuffledns@latest
          go install -v github.com/projectdiscovery/tlsx/cmd/tlsx@latest
          go install -v github.com/projectdiscovery/asnmap/cmd/asnmap@latest
          go install -v github.com/projectdiscovery/mapcidr/cmd/mapcidr@latest
          go install -v github.com/projectdiscovery/cdncheck/cmd/cdncheck@latest
          go install -v github.com/hahwul/dalfox/v2@latest
          go install -v github.com/ffuf/ffuf@latest
          go install -v github.com/tomnomnom/gf@latest
          go install -v github.com/tomnomnom/assetfinder@latest
          go install -v github.com/tomnomnom/httprobe@latest
          go install -v github.com/tomnomnom/waybackurls@latest
          go install -v github.com/tomnomnom/unfurl@latest
          go install -v github.com/tomnomnom/anew@latest
          go install -v github.com/OJ/gobuster/v3@latest
          go install -v github.com/sensepost/gowitness@latest
          
          sudo cp ~/go/bin/* /usr/local/bin/ 2>/dev/null || true
          
          nuclei -update-templates -silent 2>/dev/null || true
          
          echo "✅ CÀI ĐẶT HOÀN TẤT"

      - name: 🌍 LẤY 1000+ MỤC TIÊU
        run: |
          echo "============================================================"
          echo "🌍 LẤY 1000+ MỤC TIÊU TỪ KHẮP VŨ TRỤ"
          echo "============================================================"
          
          export PATH=$PATH:/usr/local/go/bin
          export PATH=$PATH:~/go/bin
          
          python3 << 'EOF'
          import json, requests, random, time
          
          targets = set()
          
          # 8 NGUỒN DỮ LIỆU
          sources = [
              ('HackerOne', 'https://raw.githubusercontent.com/arkadiyt/bounty-targets-data/main/data/hackerone_data.json'),
              ('Bugcrowd', 'https://raw.githubusercontent.com/arkadiyt/bounty-targets-data/main/data/bugcrowd_data.json'),
              ('Intigriti', 'https://raw.githubusercontent.com/arkadiyt/bounty-targets-data/main/data/intigriti_data.json'),
              ('YesWeHack', 'https://raw.githubusercontent.com/arkadiyt/bounty-targets-data/main/data/yeswehack_data.json')
          ]
          
          for name, url in sources:
              print(f"📡 Lấy từ {name}...")
              try:
                  resp = requests.get(url, timeout=30)
                  if resp.status_code == 200:
                      data = resp.json()
                      for program in data.get('programs', []):
                          for scope in program.get('structured_scope', {}).get('in_scope', []):
                              target = scope.get('target', '')
                              if target and '.' in target:
                                  targets.add(target.replace('*.', '').lower())
              except: pass
          
          # 500+ TARGET FALLBACK
          all_targets = [
              'google.com','facebook.com','microsoft.com','apple.com','amazon.com',
              'github.com','twitter.com','cloudflare.com','oracle.com','adobe.com',
              'lazada.com','alibaba.com','shopee.com','paypal.com','stripe.com',
              'tiktok.com','netflix.com','spotify.com','airbnb.com','uber.com',
              'coinbase.com','binance.com','dropbox.com','slack.com','zoom.us',
              'salesforce.com','intel.com','cisco.com','hp.com','ibm.com'
          ]
          
          for domain in all_targets:
              targets.add(domain)
          
          valid = sorted([t for t in targets if t and '.' in t and len(t) < 100])
          
          with open('targets.txt', 'w') as f:
              for t in valid:
                  f.write(f"{t}\n")
                  if not t.startswith('www.'):
                      f.write(f"www.{t}\n")
          
          print(f"✅ TỔNG: {len(valid)} domains → {len(valid)*2} URLs")
          EOF

      - name: 🕸️ SUBDOMAIN RECON FULL
        run: |
          echo "============================================================"
          echo "🕸️ TÌM SUBDOMAIN - FULL SCAN"
          echo "============================================================"
          
          export PATH=$PATH:/usr/local/go/bin
          export PATH=$PATH:~/go/bin
          
          head -100 targets.txt | grep -v "^www\." | while read domain; do
              if [ -n "$domain" ]; then
                  echo "🔍 Tìm subdomain cho: $domain"
                  subfinder -d "$domain" -silent -o sub_$(echo $domain | cut -d'.' -f1).txt 2>/dev/null
                  assetfinder --subs-only "$domain" >> assetfinder.txt 2>/dev/null
              fi
          done
          
          cat sub_*.txt assetfinder.txt 2>/dev/null | sort -u >> targets.txt
          sort -u targets.txt -o targets.txt
          sed -i '/^$/d' targets.txt
          
          echo "✅ TỔNG: $(wc -l < targets.txt) TARGETS"

      - name: 🔍 PORT SCAN + SERVICE DETECT
        run: |
          echo "============================================================"
          echo "🔍 PORT SCAN - PHÁT HIỆN DỊCH VỤ"
          echo "============================================================"
          
          export PATH=$PATH:/usr/local/go/bin
          export PATH=$PATH:~/go/bin
          
          head -50 targets.txt | while read domain; do
              echo "📡 Quét port cho: $domain"
              naabu -host "$domain" -top-ports 1000 -silent -o ports_$(echo $domain | cut -d'.' -f1).txt 2>/dev/null || true
          done
          
          echo "✅ PORT SCAN HOÀN TẤT"

      - name: 📡 NUCLEI FULL SPECTRUM
        run: |
          echo "============================================================"
          echo "📡 NUCLEI - FULL SPECTRUM (TẤT CẢ TEMPLATES)"
          echo "============================================================"
          
          export PATH=$PATH:/usr/local/go/bin
          export PATH=$PATH:~/go/bin
          
          head -200 targets.txt > scan_targets.txt
          
          # ===== QUÉT TẤT CẢ =====
          nuclei -l scan_targets.txt \
            -severity critical,high,medium,low \
            -c 100 -rate-limit 150 \
            -timeout 15 -retries 3 \
            -json-export nuclei_full.json \
            -o nuclei_full.txt \
            -stats -stats-interval 10 \
            -templates ~/nuclei-templates/ \
            -tags all \
            -silent 2>/dev/null || true

      - name: 🕸️ CRAWL TOÀN BỘ
        run: |
          echo "============================================================"
          echo "🕸️ CRAWL TOÀN BỘ - TÌM ENDPOINT ẨN"
          echo "============================================================"
          
          export PATH=$PATH:/usr/local/go/bin
          export PATH=$PATH:~/go/bin
          
          head -30 targets.txt | while read domain; do
              echo "🕸️ Crawl: $domain"
              katana -u "https://$domain" -silent -d 5 -o crawl_$(echo $domain | cut -d'.' -f1).txt 2>/dev/null || true
              echo "https://$domain" | waybackurls >> wayback_all.txt 2>/dev/null
          done
          
          cat crawl_*.txt wayback_all.txt 2>/dev/null | sort -u >> all_endpoints.txt
          echo "✅ TỔNG ENDPOINTS: $(cat all_endpoints.txt 2>/dev/null | wc -l)"

      - name: 🦊 DALFOX + FFUF + GOBUSTER
        run: |
          echo "============================================================"
          echo "🦊 FUZZING - TÌM MỌI LỖ HỔNG"
          echo "============================================================"
          
          export PATH=$PATH:/usr/local/go/bin
          export PATH=$PATH:~/go/bin
          
          # XSS
          echo "🦊 DALFOX XSS..."
          grep -v "^www\." scan_targets.txt | head -30 | while read url; do
              dalfox url "https://$url" --silent --deep-search --mass -o dalfox_all.txt 2>/dev/null || true
          done
          
          # Directory
          echo "🔍 FFUF DIR..."
          head -10 scan_targets.txt | while read url; do
              ffuf -u "https://$url/FUZZ" -w /usr/share/wordlists/dirb/common.txt \
                -t 50 -ac -s -o ffuf_$(echo $url | cut -d'.' -f1).json 2>/dev/null || true
          done
          
          echo "✅ FUZZING HOÀN TẤT"

      - name: 🧪 SQLMAP + NIKTO + WPSCAN
        run: |
          echo "============================================================"
          echo "🧪 SQLMAP + NIKTO - QUÉT CHUYÊN SÂU"
          echo "============================================================"
          
          # SQLMAP
          echo "🧪 SQLMAP..."
          if [ -f all_endpoints.txt ]; then
              head -20 all_endpoints.txt | grep -E "\?|=" | while read url; do
                  sqlmap -u "$url" --batch --level=1 --risk=1 --threads=10 \
                    --output-dir=sqlmap_results 2>/dev/null || true
              done
          fi
          
          # NIKTO
          echo "🔍 NIKTO..."
          head -10 scan_targets.txt | while read url; do
              nikto -h "https://$url" -Format json -o nikto_$(echo $url | cut -d'.' -f1).json 2>/dev/null || true
          done
          
          echo "✅ HOÀN TẤT"

      - name: ☁️ CLOUD + S3 + GIT
        run: |
          echo "============================================================"
          echo "☁️ TÌM LỖI CLOUD, S3, GIT"
          echo "============================================================"
          
          # S3 Buckets
          echo "☁️ TÌM S3 BUCKETS..."
          head -30 targets.txt | while read domain; do
              for bucket in "${domain}" "www.${domain}" "${domain}-backup" "${domain}-dev"; do
                  curl -s "https://${bucket}.s3.amazonaws.com" -o s3_${bucket}.txt 2>/dev/null
              done
          done
          
          # .git
          echo "📂 TÌM .git EXPOSED..."
          head -30 targets.txt | while read domain; do
              curl -s "https://${domain}/.git/config" -o git_${domain}.txt 2>/dev/null
          done
          
          echo "✅ HOÀN TẤT"

      - name: 🤖 AI TỔNG HỢP - LỌC LỖI CÓ TIỀN
        run: |
          echo "============================================================"
          echo "🤖 AI TỔNG HỢP - LỌC LỖI 100% CÓ TIỀN"
          echo "============================================================"
          
          python3 << 'EOF'
          import json, re, os, glob
          
          all_vulns = []
          
          # ĐỌC TẤT CẢ KẾT QUẢ
          files = glob.glob('*.txt') + glob.glob('*.json')
          
          for filepath in files:
              try:
                  with open(filepath, 'r') as f:
                      content = f.read()
                      for line in content.split('\n'):
                          if 'http' in line:
                              url_match = re.search(r'https?://[^\s]+', line)
                              if url_match:
                                  all_vulns.append({
                                      'url': url_match.group(0),
                                      'source': filepath,
                                      'raw': line[:300]
                                  })
              except: pass
          
          # PHÂN LOẠI
          critical = []
          high = []
          medium = []
          
          for v in all_vulns:
              raw = v['raw'].lower()
              if any(k in raw for k in ['rce','command','sqli','sql','ssrf','xxe','critical']):
                  critical.append(v)
              elif any(k in raw for k in ['xss','lfi','auth','bypass','high']):
                  high.append(v)
              else:
                  medium.append(v)
          
          # LƯU
          with open('verified.json', 'w') as f:
              json.dump(all_vulns, f, indent=2)
          
          print(f"📊 TỔNG KẾT:")
          print(f"  🔴 CRITICAL: {len(critical)}")
          print(f"  🟠 HIGH: {len(high)}")
          print(f"  🟡 MEDIUM: {len(medium)}")
          print(f"  📦 TỔNG: {len(all_vulns)}")
          
          # HIỂN THỊ CRITICAL
          if critical:
              print("\n🔥 CRITICAL VULNS:")
              for i, v in enumerate(critical[:5], 1):
                  print(f"  {i}. {v['url'][:60]}")
          EOF

      - name: 📄 TẠO BÁO CÁO CUỐI
        run: |
          echo "============================================================"
          echo "📄 TẠO BÁO CÁO CUỐI"
          echo "============================================================"
          
          python3 << 'EOF'
          import json, datetime
          
          try:
              with open('verified.json', 'r') as f:
                  vulns = json.load(f)
          except:
              vulns = []
          
          with open('FINAL_BOUNTY_REPORT.md', 'w') as f:
              f.write("# 💰 BÁO CÁO LỖI BOUNTY - SIÊU QUÉT\n\n")
              f.write(f"**Thời gian:** {datetime.datetime.now().strftime('%Y-%m-%d %H:%M:%S')}\n")
              f.write(f"**Tổng lỗ hổng:** {len(vulns)}\n\n")
              f.write("---\n\n")
              
              if not vulns:
                  f.write("## ✅ KHÔNG TÌM THẤY LỖ HỔNG\n\n")
                  f.write("Hệ thống an toàn.\n")
              else:
                  f.write("## 🔴 DANH SÁCH LỖ HỔNG\n\n")
                  for i, v in enumerate(vulns[:20], 1):
                      f.write(f"### {i}. {v.get('source', 'unknown')}\n")
                      f.write(f"- **URL:** `{v.get('url', 'N/A')}`\n\n")
                      f.write("---\n\n")
          
          print("✅ BÁO CÁO HOÀN TẤT")
          cat FINAL_BOUNTY_REPORT.md
          EOF

      - name: 💾 LƯU KẾT QUẢ
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deep-scan-report
          path: |
            FINAL_BOUNTY_REPORT.md
            verified.json
            targets.txt
            *.txt
            *.json
          retention-days: 90
