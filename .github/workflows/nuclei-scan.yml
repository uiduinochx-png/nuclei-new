name: Nuclei OMNI - Siêu Quét Tự Động

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  omni-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cài Nuclei - Tự động lấy bản mới nhất
        run: |
          # Lấy link tải mới nhất từ API GitHub
          LATEST_URL=$(curl -s https://api.github.com/repos/projectdiscovery/nuclei/releases/latest | grep browser_download_url | grep linux_amd64.zip | cut -d '"' -f 4)
          wget $LATEST_URL -O nuclei.zip
          unzip nuclei.zip
          sudo mv nuclei /usr/local/bin/
          nuclei -version

      - name: Cập nhật template mới nhất
        run: |
          nuclei -update-templates
          nuclei -ut

      - name: QUÉT SIÊU SÂU - TẤT CẢ CVEs & EXPOSURE
        run: |
          nuclei -list targets.txt \
            -tags cve,kev,exposure,panel,default-login,unauth,rce,sqli,lfi,fileupload,ssrf \
            -severity critical,high,medium \
            -o results_raw.txt \
            -json \
            -stats \
            -silent \
            -timeout 30 \
            -rate-limit 10 \
            -concurrency 30 \
            -retries 2 \
            || echo "Quét hoàn tất (có lỗi nhỏ, bỏ qua)"

      - name: Lọc lỗ hổng giá trị cao (critical + high)
        run: |
          grep -E '"severity":"(critical|high)"' results_raw.txt > results_high_value.json || echo "[]" > results_high_value.json

      - name: Upload kết quả
        uses: actions/upload-artifact@v4
        with:
          name: nuclei-omni-results
          path: |
            results_raw.txt
            results_high_value.json
