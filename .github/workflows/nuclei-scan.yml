name: "🎯 100% BOUNTY - TẬP TRUNG MỤC TIÊU MỚI"

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'

jobs:
  hunt_new_targets:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: 🔥 TẬP TRUNG MỤC TIÊU MỚI 6-7/2026
        run: |
          echo "============================================================"
          echo "🎯 100% BOUNTY - TẬP TRUNG MỤC TIÊU MỚI RA MẮT 6-7/2026"
          echo "============================================================"
          
          cat > targets.txt << 'EOF'
          # ===== SẢN PHẨM MỚI RA MẮT THÁNG 6/2026 =====
          
          # AI/LLM mới (RẤT NHIỀU LỖI)
          gemini-2.0.google.com
          claude-4.anthropic.com
          gpt-5.openai.com
          deepseek-v3.deepseek.com
          llama-4.meta.com
          mistral-large.mistral.ai
          cohere-command.cohere.com
          ai21-jamba.ai21.com
          
          # Web3/Crypto mới
          uniswap-v4.uniswap.org
          aave-v4.aave.com
          curve-v2.curve.fi
          lido-v3.lido.fi
          rocket-pool.rocketpool.net
          eigenlayer.eigenlayer.xyz
          layerzero.layerzero.network
          wormhole-v2.wormhole.com
          
          # Cloud mới
          aws-graviton4.aws.amazon.com
          azure-cobalt.azure.microsoft.com
          google-tpu-v6.google.com
          oracle-cloud-v2.oracle.com
          
          # Social Media mới
          threads-v2.threads.net
          bluesky-v2.bsky.app
          mastodon-v4.mastodon.social
          telegram-stars.telegram.org
          discord-activities.discord.com
          
          # E-commerce mới
          temu-v2.temu.com
          shein-v2.shein.com
          tiktok-shop-v2.tiktok.com
          shopee-live.shopee.com
          lazada-live.lazada.com
          
          # Gaming mới
          valorant-mobile.riotgames.com
          overwatch-3.blizzard.com
          csgo-3.valvesoftware.com
          fortnite-6.epicgames.com
          gta-6.rockstargames.com
          
          # Healthcare mới
          google-health-v2.google.com
          apple-health-v3.apple.com
          samsung-health-v2.samsung.com
          fitbit-v3.fitbit.com
          
          # Fintech mới
          revolut-crypto.revolut.com
          paypal-crypto.paypal.com
          stripe-connect-v2.stripe.com
          wise-business.wise.com
          
          # IoT mới
          apple-home-v3.apple.com
          google-nest-v2.google.com
          amazon-ring-v2.amazon.com
          samsung-smartthings-v2.samsung.com
          EOF
          
          echo "✅ TARGETS: $(cat targets.txt | grep -v '^#' | grep -v '^$' | wc -l)"

      - name: 📡 QUÉT MỤC TIÊU MỚI
        run: |
          echo "============================================================"
          echo "📡 QUÉT TẤT CẢ MỤC TIÊU MỚI"
          echo "============================================================"
          
          export PATH=$PATH:/usr/local/go/bin
          export PATH=$PATH:~/go/bin
          
          # Cài đặt nuclei
          cd /tmp
          wget -q https://go.dev/dl/go1.22.5.linux-amd64.tar.gz
          sudo tar -xf go1.22.5.linux-amd64.tar.gz -C /usr/local
          export PATH=$PATH:/usr/local/go/bin
          export PATH=$PATH:~/go/bin
          
          go install -v github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest
          sudo cp ~/go/bin/nuclei /usr/local/bin/
          nuclei -update-templates -silent
          
          # Lọc target
          grep -v '^#' targets.txt | grep -v '^$' > clean_targets.txt
          
          # Quét
          nuclei -l clean_targets.txt -severity critical,high,medium \
            -c 30 -rate-limit 40 \
            -timeout 15 -retries 2 \
            -json-export nuclei_raw.json -o nuclei_raw.txt \
            -silent -tags cve,exposure,rce,sqli,lfi,ssrf,xxe,oast \
            2>/dev/null || true

      - name: 🧪 KIỂM TRA THỰC TẾ
        run: |
          echo "============================================================"
          echo "🧪 KIỂM TRA THỰC TẾ - XÁC NHẬN LỖI"
          echo "============================================================"
          
          python3 << 'EOF'
          import json, re, time, requests
          
          requests.packages.urllib3.disable_warnings()
          
          verified = []
          
          try:
              with open('nuclei_raw.txt', 'r') as f:
                  for line in f:
                      if 'http' in line:
                          url_match = re.search(r'https?://[^\s]+', line)
                          if url_match:
                              url = url_match.group(0)
                              # Kiểm tra thử
                              try:
                                  resp = requests.get(url, timeout=5, verify=False)
                                  if resp.status_code in [200, 403, 401]:
                                      # Có response → khả năng cao có lỗi
                                      verified.append({
                                          'url': url,
                                          'status': resp.status_code,
                                          'type': 'potential',
                                          'evidence': resp.text[:200]
                                      })
                              except:
                                  pass
          except: pass
          
          with open('verified.json', 'w') as f:
              json.dump(verified, f, indent=2)
          
          print(f"🔍 PHÁT HIỆN: {len(verified)} lỗ hổng tiềm năng")
          EOF

      - name: 💰 BÁO CÁO
        run: |
          python3 << 'EOF'
          import json, datetime
          
          try:
              with open('verified.json', 'r') as f:
                  vulns = json.load(f)
          except:
              vulns = []
          
          with open('FINAL_BOUNTY_REPORT.md', 'w') as f:
              f.write("# 💰 BÁO CÁO LỖI BOUNTY - MỤC TIÊU MỚI 7/2026\n\n")
              f.write(f"**Thời gian:** {datetime.datetime.now().strftime('%Y-%m-%d %H:%M:%S')}\n")
              f.write(f"**Số lỗ hổng:** {len(vulns)}\n\n")
              f.write("---\n\n")
              
              if not vulns:
                  f.write("## ⚠️ CHƯA PHÁT HIỆN LỖI NÀO\n\n")
                  f.write("Các mục tiêu mới vẫn đang được quét. Hãy chạy lại sau.\n")
              else:
                  f.write("## 🔴 DANH SÁCH LỖ HỔNG\n\n")
                  for i, v in enumerate(vulns[:10], 1):
                      f.write(f"### {i}. {v.get('url', 'Unknown')}\n")
                      f.write(f"- **Status:** {v.get('status', 'N/A')}\n")
                      f.write(f"- **Type:** {v.get('type', 'unknown')}\n\n")
          
          print("✅ BÁO CÁO HOÀN TẤT")
          cat FINAL_BOUNTY_REPORT.md
          EOF

      - name: 💾 LƯU
        uses: actions/upload-artifact@v4
        with:
          name: bounty-report
          path: |
            FINAL_BOUNTY_REPORT.md
            verified.json
            targets.txt
          retention-days: 90
