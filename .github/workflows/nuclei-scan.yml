name: Nuclei OMNI - Siêu Quét Tự Động

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  omni-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Cài Nuclei và công cụ hỗ trợ
        run: |
          wget https://github.com/projectdiscovery/nuclei/releases/latest/download/nuclei_linux_amd64.zip
          unzip nuclei_linux_amd64.zip
          sudo mv nuclei /usr/local/bin/
          nuclei -version
          pip install requests

      - name: Cập nhật template mới nhất
        run: |
          nuclei -update-templates
          nuclei -ut

      - name: QUÉT SIÊU SÂU - TẤT CẢ CVEs & EXPOSURE
        run: |
          nuclei -list targets.txt \
            -tags cve,kev,exposure,panel,default-login,unauth,rce,sqli,lfi,fileupload,ssrf \
            -severity critical,high,medium \
            -o results_raw.txt \
            -json \
            -stats \
            -silent \
            -interactions \
            -timeout 30 \
            -rate-limit 10 \
            -concurrency 30 \
            -retries 2 \
            -project \
            -project-path nuclei-project \
            || echo "Quét hoàn tất (có lỗi nhỏ, bỏ qua)"

      - name: Lọc lỗ hổng giá trị cao (critical + high)
        run: |
          grep -E '"severity":"(critical|high)"' results_raw.txt > results_high_value.json || echo "[]" > results_high_value.json
          jq . results_high_value.json > final_report.json

      - name: Upload kết quả (JSON + HTML)
        uses: actions/upload-artifact@v3
        with:
          name: nuclei-omni-results
          path: |
            results_raw.txt
            results_high_value.json
            final_report.json
